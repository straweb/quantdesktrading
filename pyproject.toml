[project]
name = "trading-terminal-backend"
version = "1.0.0"
description = "Multi-broker trading terminal — Python backend (FastAPI REST :8000 + socket.io WS :8001)"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn>=0.29",
  "python-socketio>=5.11",
  "pydantic>=2.6,<3",
  "httpx>=0.27",
  "websockets>=11.0",
  "sqlalchemy>=2.0.55",
  "pandas>=2.3.3",
  "pyjwt>=2.15.1",
  "pyzmq>=27.2.0",
  "pytz>=2026.5",
  "websocket-client>=1.9.0",
  "cryptography>=47.0.0",
  "marshmallow>=4.0.1",
  "requests>=2.32.5",
  "cachetools>=6.2.6",
  "python-dotenv>=1.2.1",
  "flask>=3.1.3",
  "logzero>=1.7.0",
  "flask-restx>=1.3.0",
  "flask-socketio>=5.5.0",
  "joserfc>=1.1.0",
  "protobuf>=6.33.6",
  "h2>=4.3.0",
]

[tool.uv]
# deps-only project: never try to build/install this repo as a package
package = false
